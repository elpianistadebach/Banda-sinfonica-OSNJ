<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Banda Sinfónica OSNJ</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header>
    <div class="overlay">
      <h1>Inicio de Sesión o registro</h1>
      <p>Vincula tu cuenta con la Banda Sinfónica OSNJ</p>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="../../index.html">Inicio</a></li>
      <li><a href="../historia/index.html">Historia</a></li>
      <li><a href="../logros/index.html">Logros</a></li>
      <li><a href="../galeria/index.html">Galería</a></li>
      <li><a href="../contacto/index.html">Contacto</a></li>
      <li><a href="../Curso/index.html">Curso</a></li>
      <li><a href="../formularios/index.html">Formularios de Inscripción</a></li>
      <li><a href="../sesion/index.html">Inicio de Sesión</a></li>
    </ul>
  </nav>

  <main>
    <section class="auth-shell">
      <div class="auth-card">
        <h2>Iniciar sesión</h2>
        <!-- 1. Se eliminó action y method, se añadió el ID -->
        <form class="auth-form" id="formulario_login">
          
          <label>
            <span>Correo electrónico</span>
            <!-- Se añadió id="correo_electronico_login" -->
            <input type="email" id="correo_electronico_login" name="correo_electronico" placeholder="correo@ejemplo.com" required>
          </label>

          <label>
            <span>Contraseña</span>
            <!-- Se añadió id="contrasena_login" -->
            <input type="password" id="contrasena_login" name="contrasena" placeholder="••••••••" required>
          </label>

          <button type="submit">Entrar</button>
        </form>
      </div>

      <div class="auth-card">
        <h2>Regístrate</h2>
        <!-- 2. Se eliminó action y method, se añadió el ID -->
        <form class="auth-form" id="formulario_registro">
          
          <label>
            <span>Nombre completo</span>
            <!-- Se añadió id="nombre_completo" -->
            <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Tu nombre" required>
          </label>

          <label>
            <span>Correo electrónico</span>
            <!-- Se añadió id="correo_electronico_reg" para diferenciarlo del login -->
            <input type="email" id="correo_electronico_reg" name="correo_electronico" placeholder="correo@ejemplo.com" required>
          </label>

          <label>
            <span>Contraseña</span>
            <!-- Se añadió id="contrasena_reg" para diferenciarlo del login -->
            <input type="password" id="contrasena_reg" name="contrasena" placeholder="Crea una contraseña" required>
          </label>

          <label>
            <span>Confirmar contraseña</span>
            <!-- Se añadió id="confirmar_contrasena" -->
            <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="Repite la contraseña" required>
          </label>

          <button type="submit">Registrarme</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Banda Sinfónica Padre Ítalo - Obra Salesiana del Niño Jesús</p>
  </footer>

  <!-- 3. Se vinculó el archivo JS como módulo al final del body -->
  <script type="module" src="auth.js"></script>
</body>
</html>
