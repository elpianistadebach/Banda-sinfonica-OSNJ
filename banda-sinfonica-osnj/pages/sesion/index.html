    <div class="overlay">

    </div>

    </ul>

  <main>
    <section class="auth-shell">
      <div class="auth-card">
        <h2>Iniciar sesión</h2>
        <form class="auth-form" action="procesar_sesion.php" method="post">
          <input type="hidden" name="accion" value="login">

          <label>
            <span>Correo electrónico</span>
            <input type="email" name="correo_electronico" placeholder="correo@ejemplo.com" required>
          </label>

          <label>
            <span>Contraseña</span>
            <input type="password" name="contrasena" placeholder="••••••••" required>
          </label>

          <button type="submit">Entrar</button>
        </form>
      </div>

      <div class="auth-card">
        <h2>Regístrate</h2>
        <form class="auth-form" action="procesar_sesion.php" method="post">
          <input type="hidden" name="accion" value="registro">

          <label>
            <span>Nombre completo</span>
            <input type="text" name="nombre_completo" placeholder="Tu nombre" required>
          </label>

          <label>
            <span>Correo electrónico</span>
            <input type="email" name="correo_electronico" placeholder="correo@ejemplo.com" required>
          </label>

          <label>
            <span>Contraseña</span>
            <input type="password" name="contrasena" placeholder="Crea una contraseña" required>
          </label>

          <label>
            <span>Confirmar contraseña</span>
            <input type="password" name="confirmar_contrasena" placeholder="Repite la contraseña" required>
          </label>

          <button type="submit">Registrarme</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Banda Sinfónica Padre Ítalo - Obra Salesiana del Niño Jesús</p>
  </footer>
</body>
</html>
